name: YouTube Auto Post

on:
  workflow_dispatch:
    inputs:
      date:
        description: "投稿する日付（例 2026-11-08）。空なら今日"
        required: false
      dry_run:
        description: "1 にすると投稿せずに中身だけ表示（テスト用）"
        required: false
  schedule:
    # 日本時間 18:42 / 20:12 に起動（cron は UTC 表記）。2回目は保険。投稿済みなら何もしない
    - cron: "42 9 * * *"
    - cron: "12 11 * * *"

permissions:
  contents: write

concurrency:
  group: youtube-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install requests
      - name: Post
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_POST_DATE: ${{ github.event.inputs.date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python yt_post.py
      - name: Save posted record
        run: |
          git config user.name "onari-bot"
          git config user.email "onari-bot@users.noreply.github.com"
          git add video/posted_youtube.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "youtube-autopost posted: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git pull --rebase
          git push
