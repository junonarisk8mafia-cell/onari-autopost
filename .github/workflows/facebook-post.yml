name: Facebook Auto Post

on:
  workflow_dispatch:
    inputs:
      date:
        description: "投稿する日付（例 2026-11-08）。空なら今日"
        required: false
      dry_run:
        description: "1 にすると投稿せずに中身だけ表示（テスト用）"
        required: false
      check:
        description: "1 にすると投稿せずに鍵だけ確認"
        required: false
  schedule:
    # 日本時間 15:07〜23:37 に30分ごと起動（cron は UTC 表記）。GitHub は数時間遅れるので早めから置く
    # 日本19時（フィリピン18時）より前に動いた回は待つだけ。投稿済みなら何もしない
    - cron: "7,37 6-14 * * *"

permissions:
  contents: write

concurrency:
  group: facebook-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # 待ってる間に別の回が投稿していても、最新の記録を読む（二重投稿防止）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install requests
      - name: Post
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_POST_DATE: ${{ github.event.inputs.date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CHECK: ${{ github.event.inputs.check }}
        run: python fb_post.py
      - name: Save posted record
        run: |
          git config user.name "onari-bot"
          git config user.email "onari-bot@users.noreply.github.com"
          git add video/posted_facebook.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "facebook-autopost posted: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git pull --rebase
          git push
