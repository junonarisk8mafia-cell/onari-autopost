name: Instagram Auto Post

on:
  workflow_dispatch:
  schedule:
    # 日本時間 15:07〜23:37 に30分ごと起動（cron は UTC 表記）。GitHub は数時間遅れるので早めから置く
    # 18時より前に動いた回は待つだけ。その日もう投稿していれば何もしない
    - cron: "7,37 6-14 * * *"

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # 待ってる間に別の回が投稿していても、最新の記録を読む（二重投稿防止）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install requests
      - name: Post to Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python post.py
      - name: Save posted files
        run: |
          git config user.name "onari-bot"
          git config user.email "onari-bot@users.noreply.github.com"
          git add -A posts
          git diff --cached --quiet || git commit -m "posted: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git pull --rebase
          git push
