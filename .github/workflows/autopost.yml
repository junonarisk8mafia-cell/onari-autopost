name: Instagram Auto Post

on:
  workflow_dispatch:
  schedule:
    # 日本時間 3:37 / 4:37 / 5:37 に起動（cron は UTC 表記）
    # 朝5時前なら待ち、その日まだ投稿していなければ1本だけ投稿する
    - cron: "37 18 * * *"
    - cron: "37 19 * * *"
    - cron: "37 20 * * *"

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install requests
      - name: Post to Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python post.py
      - name: Save posted files
        run: |
          git config user.name "onari-bot"
          git config user.email "onari-bot@users.noreply.github.com"
          git add -A posts
          git diff --cached --quiet || git commit -m "posted: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git pull --rebase
          git push
