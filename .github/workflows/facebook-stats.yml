name: Facebook Stats

# Facebook ページとリールの成績を読んで video/fb_stats.json に保存する（投稿はしない）
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: facebook-autopost
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install requests
      - name: Fetch stats
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python fb_stats.py
      - name: Save
        run: |
          git config user.name "onari-bot"
          git config user.email "onari-bot@users.noreply.github.com"
          git add video/fb_stats.json
          git diff --cached --quiet || git commit -m "facebook stats: $(TZ=Asia/Tokyo date +%Y-%m-%d_%H%M)"
          git pull --rebase
          git push
